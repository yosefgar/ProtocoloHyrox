<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protocolo Hyrox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
/* ============================= TOKENS ============================= */
:root{
  --bg:#FAF6EE;
  --surface:#FFFFFF;
  --surface-2:#F1EADA;
  --border:#E5DAC0;
  --border-soft:#EFE7D6;
  --ink:#1C1B18;
  --ink-dim:#726B5C;
  --ink-faint:#9C9484;
  --run:#DD4B1F;
  --run-ink:#7A2A11;
  --run-soft:#FBE3D6;
  --strength:#26415C;
  --strength-ink:#152738;
  --strength-soft:#E1E7EE;
  --leg:#A96A1E;
  --leg-ink:#5E3B10;
  --leg-soft:#F3E5CA;
  --good:#3B7A57;
  --good-soft:#DCEEE2;
  --bad:#B03A2E;
  --bad-soft:#F7E2DE;
  --accent:var(--run);
  --shadow:0 1px 2px rgba(28,27,24,.05), 0 6px 20px -8px rgba(28,27,24,.18);
  --radius-s:8px;
  --radius-m:14px;
  --radius-l:20px;
  --focus:#1C1B18;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161B;
    --surface:#1B1E25;
    --surface-2:#23262F;
    --border:#33363F;
    --border-soft:#2A2D36;
    --ink:#EEEAE0;
    --ink-dim:#A6A092;
    --ink-faint:#726C60;
    --run:#FF7A47;
    --run-ink:#FFD8C4;
    --run-soft:rgba(255,122,71,.16);
    --strength:#7EA2CC;
    --strength-ink:#D6E4F2;
    --strength-soft:rgba(126,162,204,.16);
    --leg:#E0AA55;
    --leg-ink:#F5DFB2;
    --leg-soft:rgba(224,170,85,.16);
    --good:#5FBE86;
    --good-soft:rgba(95,190,134,.16);
    --bad:#E27A6C;
    --bad-soft:rgba(226,122,108,.16);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.5);
    --focus:#EEEAE0;
  }
}
:root[data-theme="dark"]{
  --bg:#14161B;
  --surface:#1B1E25;
  --surface-2:#23262F;
  --border:#33363F;
  --border-soft:#2A2D36;
  --ink:#EEEAE0;
  --ink-dim:#A6A092;
  --ink-faint:#726C60;
  --run:#FF7A47;
  --run-ink:#FFD8C4;
  --run-soft:rgba(255,122,71,.16);
  --strength:#7EA2CC;
  --strength-ink:#D6E4F2;
  --strength-soft:rgba(126,162,204,.16);
  --leg:#E0AA55;
  --leg-ink:#F5DFB2;
  --leg-soft:rgba(224,170,85,.16);
  --good:#5FBE86;
  --good-soft:rgba(95,190,134,.16);
  --bad:#E27A6C;
  --bad-soft:rgba(226,122,108,.16);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.5);
  --focus:#EEEAE0;
}

/* ============================= BASE ============================= */
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{
  font-family:'Barlow Condensed',system-ui,sans-serif;
  font-weight:700;
  letter-spacing:.01em;
  margin:0;
  text-wrap:balance;
}
.num, .mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
a{color:inherit;}
button{font:inherit;color:inherit;}
input,select,textarea{font:inherit;color:inherit;}
::selection{background:var(--run-soft);}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
button:focus-visible{outline-offset:3px;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-faint);
}

/* ============================= BUTTONS ============================= */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 20px; border-radius:999px; border:1px solid transparent;
  font-weight:600; font-size:14px; cursor:pointer; white-space:nowrap;
  transition:transform .12s ease, background .15s ease, border-color .15s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--accent); color:#fff;}
.btn-primary:hover{background:var(--run-ink);}
.btn-ghost{background:transparent; border-color:var(--border); color:var(--ink);}
.btn-ghost:hover{background:var(--surface-2);}
.btn-text{background:transparent; border:none; color:var(--ink-dim); padding:8px 6px;}
.btn-text:hover{color:var(--ink);}
.btn-sm{padding:7px 14px; font-size:13px;}
.btn[disabled]{opacity:.45; cursor:not-allowed;}
.btn-block{width:100%;}

/* ============================= SHELL / LAYOUT ============================= */
#app{min-height:100%;}
.shell{display:flex; min-height:100vh;}
.sidebar{
  width:228px; flex:none; background:var(--surface); border-right:1px solid var(--border-soft);
  padding:22px 16px; display:flex; flex-direction:column; gap:26px; position:sticky; top:0; height:100vh;
}
.brand{display:flex; align-items:center; gap:10px; padding:0 6px;}
.brand-mark{width:30px; height:30px; border-radius:8px; background:var(--run); flex:none; position:relative;}
.brand-mark::after{content:"";position:absolute; inset:7px; border:2px solid #fff; border-radius:3px;}
.brand-name{font-family:'Barlow Condensed'; font-weight:700; font-size:19px; line-height:1.05;}
.brand-name small{display:block; font-family:'IBM Plex Mono'; font-size:10px; font-weight:600; letter-spacing:.1em; color:var(--ink-faint); text-transform:uppercase;}
.nav{display:flex; flex-direction:column; gap:2px;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px;
  color:var(--ink-dim); font-weight:600; font-size:14px; cursor:pointer; border:none; background:none; text-align:left;
  border-left:3px solid transparent;
}
.nav-item:hover{background:var(--surface-2); color:var(--ink);}
.nav-item.active{background:var(--surface-2); color:var(--ink); border-left-color:var(--accent);}
.nav-dot{width:7px; height:7px; border-radius:2px; flex:none;}
.sidebar-foot{margin-top:auto; padding:10px 6px; display:flex; flex-direction:column; gap:8px;}
.profile-chip{display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:10px; background:var(--surface-2); font-size:13px;}
.profile-avatar{width:26px; height:26px; border-radius:50%; background:var(--strength); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Barlow Condensed'; font-weight:700; font-size:13px; flex:none;}

.main{flex:1; min-width:0; padding:30px 34px 90px; max-width:1120px;}
.main-head{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
.main-head h1{font-size:32px;}
.main-head .sub{color:var(--ink-dim); font-size:14px; margin-top:2px;}

.bottom-tabs{display:none;}

@media (max-width: 860px){
  .sidebar{display:none;}
  .main{padding:18px 16px 96px; max-width:100%;}
  .bottom-tabs{
    display:flex; position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:var(--surface); border-top:1px solid var(--border-soft);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  .bt-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 2px; border:none; background:none; color:var(--ink-faint); font-size:10.5px; font-weight:600; letter-spacing:.02em;}
  .bt-item .bt-dot{width:16px; height:3px; border-radius:2px; background:transparent;}
  .bt-item.active{color:var(--ink);}
  .bt-item.active .bt-dot{background:var(--accent);}
}

/* ============================= CARDS / GRID ============================= */
.grid{display:grid; gap:14px;}
.grid-stats{grid-template-columns:repeat(auto-fill,minmax(168px,1fr));}
.card{
  background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-m);
  padding:18px;
}
.card-flat{background:var(--surface-2); border:1px solid var(--border-soft); border-radius:var(--radius-m); padding:16px;}
.section{margin-bottom:30px;}
.section-title{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:10px;}
.section-title h2{font-size:20px;}

/* stat tile */
.tile{
  background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-m);
  padding:14px 15px 12px; display:flex; flex-direction:column; gap:8px;
}
.tile-top{display:flex; align-items:flex-start; justify-content:space-between; gap:6px;}
.tile-label{font-size:12px; font-weight:600; color:var(--ink-dim);}
.tile-value{font-family:'IBM Plex Mono'; font-weight:600; font-size:21px; letter-spacing:-0.01em;}
.tile-delta{font-family:'IBM Plex Mono'; font-size:12px; font-weight:600; padding:2px 7px; border-radius:999px; white-space:nowrap;}
.tile-delta.good{color:var(--good); background:var(--good-soft);}
.tile-delta.bad{color:var(--bad); background:var(--bad-soft);}
.tile-delta.flat{color:var(--ink-faint); background:var(--surface-2);}
.tile-spark{height:30px;}
.tile-date{font-size:11px; color:var(--ink-faint);}

/* pills / chips */
.chip{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:600;}
.chip-run{background:var(--run-soft); color:var(--run-ink);}
.chip-strength{background:var(--strength-soft); color:var(--strength-ink);}
.chip-leg{background:var(--leg-soft); color:var(--leg-ink);}
.chip-rest{background:var(--surface-2); color:var(--ink-faint);}
.dot{width:7px; height:7px; border-radius:2px; flex:none;}
.dot-run{background:var(--run);} .dot-strength{background:var(--strength);} .dot-leg{background:var(--leg);}

/* insight cards */
.insight{display:flex; gap:12px; padding:14px 16px; border-radius:var(--radius-m); border:1px solid var(--border-soft); background:var(--surface);}
.insight.warn{border-color:color-mix(in srgb, var(--bad) 35%, var(--border-soft));}
.insight-icon{width:30px; height:30px; border-radius:9px; flex:none; display:flex; align-items:center; justify-content:center; font-family:'Barlow Condensed'; font-weight:700; font-size:15px;}
.insight-icon.info{background:var(--strength-soft); color:var(--strength);}
.insight-icon.warn{background:var(--bad-soft); color:var(--bad);}
.insight-icon.good{background:var(--good-soft); color:var(--good);}
.insight-body h4{font-size:14.5px; font-weight:700; font-family:'IBM Plex Sans'; margin-bottom:3px;}
.insight-body p{margin:0; font-size:13.5px; color:var(--ink-dim); line-height:1.5;}

/* ============================= ONBOARDING ============================= */
.wiz{min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:0 18px 60px;}
.wiz-bar{width:100%; max-width:560px; padding:26px 0 10px; display:flex; align-items:center; gap:12px;}
.wiz-track{flex:1; height:5px; border-radius:3px; background:var(--surface-2); overflow:hidden;}
.wiz-fill{height:100%; background:var(--accent); border-radius:3px; transition:width .3s ease;}
.wiz-step-label{font-family:'IBM Plex Mono'; font-size:11px; color:var(--ink-faint); white-space:nowrap;}
.wiz-card{width:100%; max-width:560px; background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-l); padding:30px 28px; box-shadow:var(--shadow); margin-top:8px;}
.wiz-eyebrow{margin-bottom:8px;}
.wiz-card h2{font-size:27px; margin-bottom:6px;}
.wiz-hint{color:var(--ink-dim); font-size:13.5px; margin-bottom:22px; line-height:1.5;}
.field{margin-bottom:18px;}
.field label{display:block; font-size:13px; font-weight:600; margin-bottom:7px;}
.field .field-note{font-size:12px; color:var(--ink-faint); margin-top:5px;}
.input,.select{
  width:100%; padding:11px 13px; border-radius:10px; border:1px solid var(--border);
  background:var(--surface); color:var(--ink); font-size:14.5px;
}
.input:focus,.select:focus{border-color:var(--accent);}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
@media(max-width:480px){.row3{grid-template-columns:1fr 1fr;}}

.choice-group{display:flex; flex-wrap:wrap; gap:8px;}
.choice{
  padding:9px 15px; border-radius:999px; border:1px solid var(--border); background:var(--surface);
  font-size:13.5px; font-weight:600; cursor:pointer; color:var(--ink-dim);
}
.choice.selected{background:var(--ink); color:var(--bg); border-color:var(--ink);}
.choice-block{
  display:flex; align-items:center; gap:10px; padding:13px 14px; border-radius:12px; border:1px solid var(--border);
  cursor:pointer; margin-bottom:8px; background:var(--surface);
}
.choice-block.selected{border-color:var(--ink); background:var(--surface-2);}
.choice-block input{margin:0;}
.choice-block .cb-text b{display:block; font-size:13.5px;}
.choice-block .cb-text span{font-size:12px; color:var(--ink-dim);}

.slider-row{display:flex; align-items:center; gap:14px;}
.slider-row input[type=range]{flex:1; accent-color:var(--accent);}
.slider-val{font-family:'IBM Plex Mono'; font-weight:600; font-size:15px; width:34px; text-align:right;}

.toggle-line{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; border:1px solid var(--border); border-radius:12px; margin-bottom:12px;}
.toggle-line .tl-text b{display:block; font-size:13.5px;}
.toggle-line .tl-text span{font-size:12px; color:var(--ink-dim);}
.switch{width:40px; height:24px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); position:relative; cursor:pointer; flex:none;}
.switch::after{content:"";position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:var(--ink-faint); transition:.15s;}
.switch.on{background:var(--run-soft); border-color:var(--accent);}
.switch.on::after{left:18px; background:var(--accent);}

.wiz-nav{display:flex; justify-content:space-between; align-items:center; margin-top:22px; width:100%; max-width:560px;}

.injury-zone{border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:10px;}
.injury-zone.active{border-color:var(--leg);}
.injury-zone-head{display:flex; align-items:center; justify-content:between; gap:10px;}
.injury-detail{margin-top:12px; padding-top:12px; border-top:1px dashed var(--border);}

.summary-list{display:flex; flex-direction:column; gap:0;}
.summary-row{display:flex; justify-content:space-between; gap:14px; padding:9px 0; border-bottom:1px solid var(--border-soft); font-size:13.5px;}
.summary-row:last-child{border-bottom:none;}
.summary-row .k{color:var(--ink-dim);}
.summary-row .v{font-weight:600; text-align:right;}

/* ============================= PROFILE SELECT ============================= */
.gate{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
.gate-card{width:100%; max-width:420px; text-align:center;}
.gate-logo{width:52px; height:52px; border-radius:14px; background:var(--run); margin:0 auto 18px; position:relative;}
.gate-logo::after{content:"";position:absolute; inset:13px; border:3px solid #fff; border-radius:5px;}
.gate-card h1{font-size:30px; margin-bottom:6px;}
.gate-card p.sub{color:var(--ink-dim); font-size:14px; margin:0 0 26px;}
.profile-list{display:flex; flex-direction:column; gap:8px; margin-bottom:18px; text-align:left;}
.profile-row{display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--border); border-radius:12px; cursor:pointer; background:var(--surface);}
.profile-row:hover{border-color:var(--ink);}
.profile-row .pr-av{width:36px; height:36px; border-radius:50%; background:var(--strength); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Barlow Condensed'; font-weight:700; font-size:15px;}
.profile-row .pr-text b{display:block; font-size:14.5px;}
.profile-row .pr-text span{font-size:12px; color:var(--ink-faint);}
.divider-text{display:flex; align-items:center; gap:10px; color:var(--ink-faint); font-size:12px; margin:16px 0;}
.divider-text::before,.divider-text::after{content:"";flex:1; height:1px; background:var(--border-soft);}

/* ============================= CALENDAR ============================= */
.phase-strip{display:flex; gap:4px; margin-bottom:22px; border-radius:10px; overflow:hidden; height:8px;}
.phase-seg{height:100%;}
.phase-legend{display:flex; gap:16px; flex-wrap:wrap; margin-bottom:20px;}
.phase-legend-item{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-dim);}
.phase-legend-dot{width:9px; height:9px; border-radius:3px;}

.week-card{border:1px solid var(--border-soft); border-radius:var(--radius-m); margin-bottom:12px; overflow:hidden; background:var(--surface);}
.week-head{display:flex; align-items:center; justify-content:space-between; padding:13px 16px; cursor:pointer; gap:10px;}
.week-head-left{display:flex; align-items:center; gap:12px;}
.week-num{font-family:'IBM Plex Mono'; font-weight:600; font-size:13px; color:var(--ink-faint); width:34px;}
.week-phase{font-size:13.5px; font-weight:700;}
.week-meta{font-size:12px; color:var(--ink-faint);}
.week-chevron{transition:transform .15s ease; color:var(--ink-faint);}
.week-card.open .week-chevron{transform:rotate(180deg);}
.week-days{display:none; padding:0 16px 14px;}
.week-card.open .week-days{display:grid; grid-template-columns:repeat(7,1fr); gap:8px;}
@media(max-width:760px){.week-card.open .week-days{grid-template-columns:1fr; gap:6px;}}
.day-cell{border:1px solid var(--border-soft); border-radius:10px; padding:9px 10px; min-height:88px; display:flex; flex-direction:column; gap:6px;}
.day-cell.rest{background:var(--surface-2); align-items:center; justify-content:center; text-align:center; min-height:60px;}
.day-dow{font-size:10.5px; font-weight:700; letter-spacing:.04em; color:var(--ink-faint); text-transform:uppercase;}
.day-title{font-size:12.5px; font-weight:700; line-height:1.25;}
.day-detail{font-size:11px; color:var(--ink-dim); line-height:1.4;}
.today-mark{outline:2px solid var(--accent); outline-offset:-2px;}

/* ============================= MARCAS ============================= */
.marca-log-row{display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--border-soft);}
.marca-log-row:last-child{border-bottom:none;}
.ml-dot{width:9px; height:9px; border-radius:3px; flex:none;}
.ml-main{flex:1; min-width:0;}
.ml-main b{font-size:13.5px; display:block;}
.ml-main span{font-size:12px; color:var(--ink-faint);}
.ml-val{font-family:'IBM Plex Mono'; font-weight:600; font-size:13.5px; white-space:nowrap;}

.log-type-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:20px;}
@media(max-width:520px){.log-type-grid{grid-template-columns:1fr;}}
.log-type-card{border:1px solid var(--border); border-radius:12px; padding:14px; cursor:pointer; background:var(--surface); text-align:left;}
.log-type-card:hover{border-color:var(--ink);}
.log-type-card b{display:block; font-size:14px; margin-bottom:2px;}
.log-type-card span{font-size:12px; color:var(--ink-dim);}

.ex-row{display:grid; grid-template-columns:2fr .8fr .8fr .9fr .7fr auto; gap:8px; align-items:center; margin-bottom:8px;}
@media(max-width:640px){.ex-row{grid-template-columns:1fr 1fr; }}
.ex-row select,.ex-row input{padding:8px 9px; font-size:13px;}
.ex-remove{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:16px;padding:4px;}

.modal-backdrop{position:fixed; inset:0; background:rgba(20,18,14,.45); display:flex; align-items:flex-end; justify-content:center; z-index:60; padding:0;}
@media(min-width:640px){.modal-backdrop{align-items:center; padding:20px;}}
.modal{background:var(--surface); width:100%; max-width:600px; max-height:90vh; overflow-y:auto; border-radius:20px 20px 0 0; padding:24px 22px 28px;}
@media(min-width:640px){.modal{border-radius:var(--radius-l);}}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.modal-head h3{font-size:21px;}
.modal-close{background:none; border:none; font-size:20px; color:var(--ink-faint); cursor:pointer; padding:4px 8px;}

.badge-warn{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; background:var(--bad-soft); color:var(--bad);}

.empty-state{text-align:center; padding:50px 20px; color:var(--ink-dim);}
.empty-state h3{font-size:19px; color:var(--ink); margin-bottom:6px;}
.empty-state p{font-size:13.5px; max-width:340px; margin:0 auto 18px;}

.perfil-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}

function filteredCatalog(perfil, cat){
  const injuries = (perfil.lesiones||[]).filter(l=>l.estado!=='antigua');
  const blockedTags = new Set();
  injuries.forEach(l=>{ blockedTags.add(l.zona); (l.limita||[]).forEach(m=>blockedTags.add(m)); });
  const equipAllowed = equipLevelsFor(perfil.disponibilidad);
  return CATALOG.filter(e=> !cat || e.cat===cat).map(e=>{
    const risky = e.tags.some(t=>blockedTags.has(t));
    const equipOk = equipAllowed.has(e.equip);
    if(!equipOk) return null;
    if(risky){
      const subSlug = SUBSTITUTE[e.slug];
      const sub = subSlug ? CATALOG.find(x=>x.slug===subSlug) : null;
      if(sub && equipAllowed.has(sub.equip) && !sub.tags.some(t=>blockedTags.has(t))) return {...sub, substituted:e.label};
      return null;
    }
    return e;
  }).filter(Boolean);
}
function equipLevelsFor(disp){
  if(!disp) return new Set(['none']);
  const set = new Set(['none']);
  if(disp.equipamiento==='completo'){set.add('basic');set.add('full');}
  if(disp.equipamiento==='basico'){set.add('basic');}
  if(disp.estaciones) set.add('estacion');
  return set;
}

/* --------------------------- PERIODIZATION ENGINE --------------------------- */
const DOW = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const DAY_PATTERNS = {
  2:[0,3], 3:[0,2,4], 4:[0,1,3,5], 5:[0,1,2,4,5], 6:[0,1,2,3,4,5],
};
const TYPE_PATTERNS = {
  base:{2:['strength','run'],3:['run','strength','mobility'],4:['run','strength','run','strength'],5:['run','strength','run','strength','mobility'],6:['run','strength','run','strength','mobility','run']},
  build:{2:['hybrid','run'],3:['run','strength','hybrid'],4:['run','strength','hybrid','run'],5:['run','strength','hybrid','strength','run'],6:['run','strength','hybrid','strength','run','hybrid']},
  peak:{2:['hybrid','run'],3:['hybrid','run','strength'],4:['hybrid','run','hybrid','strength'],5:['hybrid','run','strength','hybrid','run'],6:['hybrid','run','strength','hybrid','run','mobility']},
  taper:{2:['run','hybrid'],3:['run','mobility','hybrid'],4:['run','strength','mobility','hybrid'],5:['run','strength','mobility','hybrid','run'],6:['run','strength','mobility','hybrid','run','mobility']},
};
const PHASE_LABEL = {base:'Base', build:'Construcción', peak:'Específico / Pico', taper:'Puesta a punto'};
const PHASE_COLOR_VAR = {base:'--strength', build:'--leg', peak:'--run', taper:'--good'};

function phasesForWeeks(total){
  let dist;
  if(total>=16) dist=[['base',.40],['build',.30],['peak',.20],['taper',.10]];
  else if(total>=12) dist=[['base',.30],['build',.35],['peak',.25],['taper',.10]];
  else if(total>=8) dist=[['build',.45],['peak',.35],['taper',.20]];
  else dist=[['peak',.70],['taper',.30]];
  let weeks = dist.map(([name,pct])=>[name, Math.max(1,Math.round(total*pct))]);
  let sum = weeks.reduce((a,[,w])=>a+w,0);
  weeks[weeks.length-1][1] += (total-sum);
  weeks = weeks.filter(([,w])=>w>0);
  const out=[]; let wk=1;
  weeks.forEach(([name,w])=>{ for(let i=0;i<w;i++){ out.push(name); } });
  return out.slice(0,total);
}

function sessionTitle(type, phase, perfil, dayIdx){
  const nivel = perfil.nivel_running||{}, fuerza = perfil.nivel_fuerza||{};
  if(type==='run'){
    const opts = {
      base:['Rodaje continuo suave (Z2) — progresivo en volumen','Rodaje regenerativo + técnica de carrera (skipping, talones)'],
      build:['Series de umbral: 5-6 × 1000m a ritmo objetivo + 2min trote','Fartlek 20-25min con cambios de ritmo'],
      peak:['Compromised running: 4 × 1km con estación intermedia (wall balls / burpees)','Series a ritmo carrera + simulación de tramo Hyrox'],
      taper:['Activación corta: 15-20min suave + 4 × 100m progresivos','Rodaje ligero, sensaciones, sin fatiga'],
    };
    const list = opts[phase]||opts.base;
    return list[dayIdx%list.length];
  }
  if(type==='strength'){
    const lower = dayIdx%2===0;
    return lower? 'Fuerza tren inferior + core' : 'Fuerza tren superior + core';
  }
  if(type==='hybrid'){
    const opts = {
      build:'Circuito estaciones Hyrox (volumen moderado)',
      peak:'Simulación Hyrox: bloque de estaciones a ritmo de prueba',
      base:'Introducción a estaciones — técnica y control',
      taper:'Toque de estaciones — corto y de calidad',
    };
    return opts[phase]||opts.build;
  }
  if(type==='mobility') return 'Movilidad, core y recuperación activa';
  return 'Descanso';
}

function exercisesForDay(type, perfil, dayIdx){
  const n = (perfil.disponibilidad&&perfil.disponibilidad.minutos>=45)?4:3;
  if(type==='strength'){
    const lower = dayIdx%2===0;
    const cats = lower? ['squat','hinge','lunge','core'] : ['push','pull','core','accessory_leg'];
    const picks=[];
    cats.forEach(c=>{ const opts=filteredCatalog(perfil,c); if(opts.length) picks.push(opts[0]); });
    return picks.slice(0,n);
  }
  if(type==='hybrid'){
    const opts = filteredCatalog(perfil,'hyrox');
    return opts.slice(0,Math.min(n+1,opts.length));
  }
  if(type==='mobility'){
    return filteredCatalog(perfil,'core').slice(0,2);
  }
  return [];
}

function generatePlan(perfil){
  const totalWeeks = perfil.semanas_disponibles;
  const d = Math.max(2,Math.min(6, perfil.disponibilidad.dias||3));
  const phaseSeq = phasesForWeeks(totalWeeks);
  const currentFreq = Math.max(0, Math.min(d, (perfil.nivel_running&&perfil.nivel_running.frecuencia)||0));

  const weeks = phaseSeq.map((phase,i)=>{
    const weekNum = i+1;
    let types = [...(TYPE_PATTERNS[phase][d]||TYPE_PATTERNS.build[d])];
    // ramp: en fase base, limitar sesiones de carrera al ritmo actual + progresion gradual
    if(phase==='base'){
      const runSlots = types.map((t,idx)=>t==='run'?idx:-1).filter(x=>x>=0);
      const allowedRuns = Math.min(runSlots.length, currentFreq + Math.floor(weekNum/2));
      runSlots.forEach((idx,ri)=>{ if(ri>=Math.max(1,allowedRuns)) types[idx]='mobility'; });
    }
    const activeIdx = DAY_PATTERNS[d];
    const days = DOW.map((dow,dayPos)=>{
      const slot = activeIdx.indexOf(dayPos);
      if(slot===-1) return {dow, type:'rest', title:'Descanso', detail:'', exercises:[]};
      const type = types[slot];
      return {
        dow, type,
        title: sessionTitle(type, phase, perfil, slot),
        detail: (perfil.disponibilidad.minutos? '~'+perfil.disponibilidad.minutos+' min · ' : '') + (phase==='taper'?'volumen reducido':''),
        exercises: exercisesForDay(type, perfil, slot),
      };
    });
    return {weekNum, phase, days};
  });
  return {totalWeeks, dias_semana:d, generatedAt:Date.now(), weeks};
}

/* --------------------------- FEEDBACK ENGINE --------------------------- */
function computeInsights(perfil, marcas){
  const out = [];
  const runs = marcas.filter(m=>m.marker_id==='run' && m.distance_km && m.time_sec).sort((a,b)=>a.created_at-b.created_at);

  // Regla del 110%
  if(runs.length>=2){
    const last = runs[runs.length-1];
    const priorWindow = runs.filter(r=> r!==last && (last.created_at - r.created_at) <= 37*86400000 && (last.created_at - r.created_at) > 3*86400000);
    if(priorWindow.length){
      const maxPrior = Math.max(...priorWindow.map(r=>r.distance_km));
      if(last.distance_km > maxPrior*1.10){
        out.push({level:'warn', title:'Salto de distancia por encima del 110%', text:`Tu última carrera (${last.distance_km.toFixed(1)} km) supera en más de un 10% tu carrera más larga del último mes (${maxPrior.toFixed(1)} km). Un salto brusco de una sola sesión predice mejor el riesgo de lesión que el clásico +10% semanal — no lo repitas en la próxima salida.`});
      }
    }
  }

  // Separación 48h
  const legHeavy = marcas.filter(m=> m.marker_key && (m.marker_key.includes('sentadilla')||m.marker_key.includes('peso-muerto')||m.marker_key.includes('zancada')) ).sort((a,b)=>b.created_at-a.created_at)[0];
  const qualityRun = runs[runs.length-1];
  if(legHeavy && qualityRun){
    const diffH = Math.abs(legHeavy.created_at - qualityRun.created_at)/3600000;
    if(diffH < 48 && diffH>0){
      out.push({level:'warn', title:'Menos de 48h entre pierna pesada y carrera de calidad', text:'Has registrado trabajo pesado de pierna y una carrera de calidad con menos de 48h de separación. La fatiga neuromuscular puede alterar tu técnica de carrera — deja al menos 48h entre ambos estímulos cuando puedas.'});
    }
  }

  // Proyección tiempo de carrera
  if(perfil.nivel_running && perfil.nivel_running.pace5k_sec){
    const free = perfil.nivel_running.pace5k_sec;
    const lo = free+10, hi = free+15;
    out.push({level:'info', title:'Proyección de ritmo en prueba (solo carrera)', text:`Con tu ritmo libre actual (${paceToStr(free)}/km), un rango realista en la propia prueba es ${paceToStr(lo)}–${paceToStr(hi)}/km por tramo (8×1km ≈ ${secToClock(lo*8)}–${secToClock(hi*8)}). Esto es solo el tiempo de carrera, no el tiempo total (que incluye las 8 estaciones).`});
  }

  // Benchmark de categoría
  if(perfil.fisiologia && (perfil.fisiologia.sexo==='hombre'||perfil.fisiologia.sexo==='mujer')){
    const b = BENCH[perfil.fisiologia.sexo];
    out.push({level:'info', title:'Referencia de categoría (Open)', text:`Como referencia — nunca como objetivo fijo — el tiempo medio en Open ronda ${b.media}, y una marca competitiva se sitúa en ${b.competitivo}.`});
  }

  // Progresión de fuerza generalizada
  const byKey = {};
  marcas.filter(m=>m.marker_key && m.marker_key.startsWith('ex:') && m.weight_kg!=null).forEach(m=>{ (byKey[m.marker_key]=byKey[m.marker_key]||[]).push(m); });
  Object.keys(byKey).forEach(k=>{
    const arr = byKey[k].sort((a,b)=>a.created_at-b.created_at);
    if(arr.length>=2){
      const prev = arr[arr.length-2], last = arr[arr.length-1];
      if(prev.weight_kg>0){
        const pct = (last.weight_kg-prev.weight_kg)/prev.weight_kg;
        if(pct > 0.15) out.push({level:'warn', title:`Salto de carga en ${last.marker_label||k.replace('ex:','')}`, text:`Subiste de ${prev.weight_kg}kg a ${last.weight_kg}kg — un +${Math.round(pct*100)}%. Vigila la técnica en las próximas series.`});
        else if(pct===0 && arr.length>=3 && arr[arr.length-3].weight_kg===last.weight_kg) out.push({level:'info', title:`Estancamiento en ${last.marker_label||k.replace('ex:','')}`, text:'Llevas varias sesiones con la misma carga. Puede ser buen momento para variar reps, tempo o volumen.'});
      }
    }
  });

  // Palabras clave de dolor
  const painWords = ['duele','dolor','molestia','tirón','tiron','pinchazo'];
  const recentPain = marcas.filter(m=>m.note && painWords.some(w=>m.note.toLowerCase().includes(w))).sort((a,b)=>b.created_at-a.created_at)[0];
  if(recentPain){
    out.push({level:'warn', title:'Mención de molestia en tus notas', text:`Registraste "${recentPain.note}" el ${new Date(recentPain.created_at).toLocaleDateString('es-ES')}. Si persiste, revísalo con un fisioterapeuta antes de seguir cargando esa zona.`});
  }

  // Recordatorio de registro
  if(marcas.length){
    const lastAny = Math.max(...marcas.map(m=>m.created_at));
    const daysSince = Math.floor((Date.now()-lastAny)/86400000);
    if(daysSince>=4) out.push({level:'info', title:'Sin registrar marcas hace '+daysSince+' días', text:'Llevas unos días sin apuntar ninguna marca. Registrar aunque sea una sesión corta ayuda a que el motor de progresión tenga datos frescos.'});
  } else {
    out.push({level:'info', title:'Aún no tienes marcas registradas', text:'Registra tu primera carrera o sesión de fuerza para empezar a ver progresión y recibir feedback.'});
  }

  return out;
}

  const initials = (p.name||'?').slice(0,2).toUpperCase();
  const navItems = [
    ['resumen','Resumen','--run'], ['calendario','Calendario','--strength'], ['marcas','Marcas','--leg'], ['perfil','Perfil','--ink-dim'],
  ];
  return `
  <div class="shell">
    <div class="sidebar">
      <div class="brand"><div class="brand-mark"></div><div class="brand-name">PROTOCOLO<br>HYROX</div></div>
      <div class="nav">
        ${navItems.map(([id,label,cv])=>`
          <button class="nav-item ${State.view===id?'active':''}" data-nav="${id}">
            <span class="nav-dot" style="background:var(${cv})"></span>${label}
          </button>`).join('')}
      </div>
      <div class="sidebar-foot">
        <div class="profile-chip"><div class="profile-avatar">${initials}</div><div><b style="display:block;font-size:13px;">${escapeHtml(p.name)}</b></div></div>
        <button class="btn-text" data-action="sign-out" style="justify-content:flex-start;padding-left:4px;">Cerrar sesión</button>
      </div>
    </div>
    <div class="main">
      ${State.view==='resumen'?renderResumen():''}
      ${State.view==='calendario'?renderCalendario():''}
      ${State.view==='marcas'?renderMarcas():''}
      ${State.view==='perfil'?renderPerfilView():''}
    </div>
  </div>
  <div class="bottom-tabs">
    ${navItems.map(([id,label,cv])=>`
      <button class="bt-item ${State.view===id?'active':''}" data-nav="${id}"><span class="bt-dot"></span>${label}</button>`).join('')}
  </div>
  ${State.logType!==null?renderLogModal():''}
  `;
}

function bindShell(){
  $$('[data-nav]').forEach(el=>el.addEventListener('click',()=>{ State.view = el.dataset.nav; render(); }));
  const so = $('[data-action="sign-out"]'); if(so) so.addEventListener('click', async ()=>{ await Auth.signOut(); State.profile=null; State.marcas=[]; State.view='auth'; render(); });
  bindResumen(); bindCalendario(); bindMarcas(); bindPerfilView(); bindLogModal();
}

/* --------------------------- AUTH (magic link) --------------------------- */
let _authState = 'form'; // 'form' | 'sent'
function renderAuth(){
  return `
  <div class="gate">
    <div class="gate-card">
      <div class="gate-logo"></div>
      <h1>Protocolo Hyrox</h1>
      <p class="sub">Tu plan de entrenamiento personalizado para preparar una prueba Hyrox.</p>
      ${_authState==='form' ? `
        <div class="field" style="text-align:left;"><label>Email</label><input class="input" id="auth-email" type="email" placeholder="tú@email.com" autocomplete="email"></div>
        <button class="btn btn-primary btn-block" data-action="send-link">Enviar enlace de acceso</button>
        <p class="field-note" style="margin-top:14px;">Sin contraseña: te enviamos un enlace mágico por email para entrar.</p>
      ` : `
        <div class="empty-state" style="padding:10px 0;">
          <h3>Revisa tu email</h3>
          <p>Te hemos enviado un enlace de acceso. Ábrelo desde este mismo dispositivo para entrar.</p>
        </div>
        <button class="btn btn-ghost btn-block" data-action="retry-link">Usar otro email</button>
      `}
    </div>
  </div>`;
}
function bindAuth(){
  const send = $('[data-action="send-link"]');
  if(send) send.addEventListener('click', async ()=>{
    const email = ($('#auth-email').value||'').trim();
    if(!email || !email.includes('@')){ alert('Introduce un email válido.'); return; }
    send.disabled = true; send.textContent = 'Enviando…';
    try{
      const { error } = await Auth.sendMagicLink(email);
      if(error) throw error;
      _authState = 'sent';
      render();
    }catch(e){
      alert('No hemos podido enviar el enlace: '+(e.message||e));
      send.disabled = false; send.textContent = 'Enviar enlace de acceso';
    }
  });
  const retry = $('[data-action="retry-link"]'); if(retry) retry.addEventListener('click', ()=>{ _authState='form'; render(); });
}
function startOnboarding(){
  State.draft = initDraft();
  State.onboardingStep = 0;
  State.newProfileName = '';
  State.view = 'onboarding';
  render();
}

/* --------------------------- ONBOARDING WIZARD --------------------------- */
const WIZ_STEPS = ['nombre','prueba','running','fuerza','fisiologia','lesiones','disponibilidad','objetivo','resumen'];
const WIZ_LABELS = {nombre:'Tu nombre', prueba:'Selección de prueba', running:'Nivel — running', fuerza:'Nivel — fuerza', fisiologia:'Fisiología básica', lesiones:'Lesiones y limitaciones', disponibilidad:'Disponibilidad', objetivo:'Objetivo', resumen:'Resumen'};

function renderOnboarding(){
  const step = WIZ_STEPS[State.onboardingStep];
  const pct = Math.round(((State.onboardingStep)/(WIZ_STEPS.length-1))*100);
  return `
  <div class="wiz">
    <div class="wiz-bar">
      <span class="wiz-step-label">${State.onboardingStep+1} / ${WIZ_STEPS.length}</span>
      <div class="wiz-track"><div class="wiz-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="wiz-card">
      <div class="eyebrow wiz-eyebrow">${WIZ_LABELS[step]}</div>
      ${renderWizStep(step)}
    </div>
    <div class="wiz-nav">
      ${State.onboardingStep>0?`<button class="btn btn-ghost" data-wiz="back">Atrás</button>`:`<span></span>`}
      <button class="btn btn-primary" data-wiz="next">${step==='resumen'?'Generar mi plan':'Siguiente'}</button>
    </div>
  </div>`;
}

function renderWizStep(step){

  if(step==='prueba') return `
    <h2>Selección de prueba</h2>
    <p class="wiz-hint">Empezamos por Hyrox Open individual — Pro, Doubles y Relay llegarán más adelante.</p>

      <label>Modalidad</label>

    </div>
    <div class="toggle-line">

    </div>
    ${d.sin_fecha? `
      <div class="field"><label>Duración del plan genérico</label>
        <div class="choice-group">
          ${[12,14,16].map(w=>`<span class="choice ${d.duracion_generica===w?'selected':''}" data-choice="duracion_generica" data-val="${w}">${w} semanas</span>`).join('')}

      <div class="field"><label>Tiempo total en una Hyrox previa (h:mm:ss) — opcional</label><input class="input" id="f-hyroxprev" placeholder="1:32:00" value="${d.nivel_running.hyrox_previo_raw||''}"></div>
    `}
    <div class="field">
      <label>Frecuencia actual de carrera (sesiones/semana, últimas 4-6 semanas)</label>
      <div class="slider-row"><input type="range" min="0" max="7" value="${d.nivel_running.frecuencia}" id="f-frecuencia"><span class="slider-val num" id="f-frecuencia-val">${d.nivel_running.frecuencia}</span></div>
    </div>
  `;
  if(step==='fuerza') return `
    <h2>Test de nivel — fuerza</h2>
    <p class="wiz-hint">1RM real o estimado. Si no lo sabes, usamos una estimación con la fórmula de Epley a partir de una serie submáxima — no hace falta ir al fallo.</p>
    ${['squat','deadlift','bench'].map(lift=>{
      const lbl = {squat:'Sentadilla',deadlift:'Peso muerto',bench:'Press banca'}[lift];
      return `
      <div class="field">
        <label>${lbl} — 1RM (kg)</label>
        <div class="toggle-line" style="margin-bottom:8px;">

          <div class="switch ${d.nivel_fuerza[lift+'_est']?'on':''}" data-toggle="nivel_fuerza.${lift}_est"></div>
        </div>
        ${d.nivel_fuerza[lift+'_est'] ? `
          <div class="row2">
            <input class="input" placeholder="Peso (kg)" id="f-${lift}-w" value="${d.nivel_fuerza[lift+'_subw']||''}">
            <input class="input" placeholder="Reps" id="f-${lift}-r" value="${d.nivel_fuerza[lift+'_subr']||''}">
          </div>

    <div class="row2">
      <div class="field"><label>Dominadas estrictas (máx.)</label><input class="input" id="f-dominadas" value="${d.nivel_fuerza.dominadas||''}"></div>

          <option value="no" ${d.nivel_fuerza.wallballs20==='no'?'selected':''}>Aún no</option>
          <option value="no_probado" ${d.nivel_fuerza.wallballs20==='no_probado'?'selected':''}>No lo he probado</option>
        </select>

          <option value="hombre" ${d.fisiologia.sexo==='hombre'?'selected':''}>Hombre</option>

        </select>

    <div class="row2">
      <div class="field"><label>Peso corporal (kg) — opcional</label><input class="input" id="f-peso" value="${d.fisiologia.peso||''}"></div>

    </div>
    <div class="field"><label>Historial deportivo</label>
      <div class="choice-group">
        ${[['sedentario','Sedentario'],['activo','Activo recreativo'],['entrenado','Deportista entrenado']].map(([v,l])=>`<span class="choice ${d.fisiologia.historial===v?'selected':''}" data-choice="fisiologia.historial" data-val="${v}">${l}</span>`).join('')}

    const zones = ['rodilla','espalda_baja','hombro','tobillo','cadera'];
    return `
    <h2>Lesiones y limitaciones</h2>
    <p class="wiz-hint">Marca lo que aplique — filtraremos o sustituiremos ejercicios de riesgo automáticamente.</p>

      const entry = d.lesiones.find(l=>l.zona===z);
      return `
      <div class="injury-zone ${entry?'active':''}">
        <label style="display:flex;align-items:center;gap:9px;cursor:pointer;">

        </label>
        ${entry?`
        <div class="injury-detail">
          <div class="field"><label>Estado</label>
            <div class="choice-group">
              ${[['activa','Activa'],['rehab','En rehabilitación'],['antigua','Antigua, sin síntomas']].map(([v,l])=>`<span class="choice ${entry.estado===v?'selected':''}" data-injury-estado="${z}" data-val="${v}">${l}</span>`).join('')}
            </div>
          </div>
          <div class="field"><label>Movimientos que limita</label>
            <div class="choice-group">
              ${[['carga_axial','Carga axial'],['impacto','Impacto']].map(([v,l])=>`<span class="choice ${(entry.limita||[]).includes(v)?'selected':''}" data-injury-limita="${z}" data-val="${v}">${l}</span>`).join('')}
            </div>
          </div>
        </div>`:''}
      </div>`;
    }).join('')}
    <div class="field"><label>Otra lesión (texto libre)</label><input class="input" id="f-otra-lesion" placeholder="Ej. tendinitis en el codo" value="${d.otra_lesion||''}"></div>

  if(step==='disponibilidad') return `
    <h2>Disponibilidad</h2>
    <div class="field"><label>Días de entrenamiento por semana</label>

    </div>
    ${!d.objetivo.primera_vez?`
      <div class="field"><label>Tiempo total en tu última Hyrox (h:mm:ss)</label><input class="input" id="f-tiempo-previo" placeholder="1:24:10" value="${d.objetivo.tiempo_previo_raw||''}"></div>

    <div class="field"><label>¿Cuál es tu objetivo?</label>
      <div class="choice-group">
        ${[['finisher','Solo finisher'],['mejorar','Mejorar tiempo'],['competir','Competir en categoría']].map(([v,l])=>`<span class="choice ${d.objetivo.meta===v?'selected':''}" data-choice="objetivo.meta" data-val="${v}">${l}</span>`).join('')}
      </div>
    </div>
  `;
  if(step==='resumen'){
    const semanas = computeSemanas(d);
    return `
    <h2>Revisa tu perfil</h2>
    <p class="wiz-hint">Con esto generamos tu calendario. Podrás actualizarlo más adelante desde tu Perfil.</p>
    <div class="summary-list">
      <div class="summary-row"><span class="k">Semanas disponibles</span><span class="v num">${semanas}</span></div>
      <div class="summary-row"><span class="k">Running</span><span class="v">${d.nivel_running.pace5k_sec_raw||d.nivel_running.pace1k_sec_raw||'sin marca'} · ${d.nivel_running.frecuencia} sesiones/sem</span></div>
      <div class="summary-row"><span class="k">Fuerza</span><span class="v">Sentadilla ${d.nivel_fuerza.squat||'—'}kg · PM ${d.nivel_fuerza.deadlift||'—'}kg · Banca ${d.nivel_fuerza.bench||'—'}kg</span></div>
      <div class="summary-row"><span class="k">Lesiones</span><span class="v">${d.lesiones.length? d.lesiones.map(l=>ZONE_LABEL[l.zona]).join(', ') : 'Ninguna declarada'}</span></div>
      <div class="summary-row"><span class="k">Disponibilidad</span><span class="v">${d.disponibilidad.dias} días/sem · ${d.disponibilidad.minutos} min</span></div>
      <div class="summary-row"><span class="k">Objetivo</span><span class="v">${({finisher:'Finisher',mejorar:'Mejorar tiempo',competir:'Competir'})[d.objetivo.meta]}</span></div>
    </div>
  `;}
  return '';
}

function computeSemanas(d){
  if(d.sin_fecha || !d.fecha_evento) return d.duracion_generica;
  return Math.max(4, Math.min(52, Math.ceil(daysBetween(todayISO(), d.fecha_evento)/7)));
}

function bindOnboarding(){
  const d = State.draft;
  $$('[data-toggle]').forEach(el=>el.addEventListener('click',()=>{
    const path = el.dataset.toggle.split('.');
    let obj=d; for(let i=0;i<path.length-1;i++) obj=obj[path[i]];
    obj[path[path.length-1]] = !obj[path[path.length-1]];
    render();
  }));
  $$('[data-choice]').forEach(el=>el.addEventListener('click',()=>{
    const path = el.dataset.choice.split('.'); let obj=d; for(let i=0;i<path.length-1;i++) obj=obj[path[i]];
    obj[path[path.length-1]] = isNaN(el.dataset.val)? el.dataset.val : Number(el.dataset.val);
    render();
  }));
  const dias = $('#f-dias'); if(dias) dias.addEventListener('input', e=>{ $('#f-dias-val').textContent=e.target.value; });
  const minutos = $('#f-minutos'); if(minutos) minutos.addEventListener('input', e=>{ $('#f-minutos-val').textContent=e.target.value; });
  const frec = $('#f-frecuencia'); if(frec) frec.addEventListener('input', e=>{ $('#f-frecuencia-val').textContent=e.target.value; });

  $$('[data-injury-zone]').forEach(el=>el.addEventListener('change',()=>{
    const z = el.dataset.injuryZone;
    if(el.checked){ d.lesiones.push({zona:z, estado:'activa', limita:[]}); }
    else{ d.lesiones = d.lesiones.filter(l=>l.zona!==z); }
    render();
  }));
  $$('[data-injury-estado]').forEach(el=>el.addEventListener('click',()=>{
    const z=el.dataset.injuryEstado; const l=d.lesiones.find(x=>x.zona===z); if(l) l.estado=el.dataset.val; render();
  }));
  $$('[data-injury-limita]').forEach(el=>el.addEventListener('click',()=>{
    const z=el.dataset.injuryLimita; const l=d.lesiones.find(x=>x.zona===z); if(!l) return;
    l.limita = l.limita||[];
    if(l.limita.includes(el.dataset.val)) l.limita=l.limita.filter(v=>v!==el.dataset.val); else l.limita.push(el.dataset.val);
    render();
  }));

  const est = $('[data-wiz="next"]');
  if(est) est.addEventListener('click', onWizNext);
  const back = $('[data-wiz="back"]');
  if(back) back.addEventListener('click', ()=>{ State.onboardingStep=Math.max(0,State.onboardingStep-1); render(); });
}

function readCurrentStepInputs(){
  const d = State.draft; const step = WIZ_STEPS[State.onboardingStep];
  if(step==='nombre'){ State.newProfileName = $('#f-nombre').value.trim(); }
  if(step==='prueba'){ const fe = $('#f-fecha'); if(fe) d.fecha_evento = fe.value||null; }
  if(step==='running'){
    const f5 = $('#f-5k'); if(f5){ d.nivel_running.pace5k_sec_raw=f5.value; const t=clockToSec(f5.value); d.nivel_running.pace5k_sec = t? Math.round(t/5): null; }
    const f1 = $('#f-1k'); if(f1){ d.nivel_running.pace1k_sec_raw=f1.value; const t=clockToSec(f1.value); d.nivel_running.pace1k_sec=t; if(t) d.nivel_running.pace5k_sec = d.nivel_running.pace5k_sec || t; }
    const fh = $('#f-hyroxprev'); if(fh){ d.nivel_running.hyrox_previo_raw=fh.value; d.nivel_running.hyrox_previo_sec = clockToSec(fh.value); }
    const fr = $('#f-frecuencia'); if(fr) d.nivel_running.frecuencia = Number(fr.value);
  }
  if(step==='fuerza'){
    ['squat','deadlift','bench'].forEach(lift=>{
      if(d.nivel_fuerza[lift+'_est']){
        const w=$('#f-'+lift+'-w'), r=$('#f-'+lift+'-r');
        if(w&&r){ d.nivel_fuerza[lift+'_subw']=w.value; d.nivel_fuerza[lift+'_subr']=r.value;
          const wv=parseFloat(w.value), rv=parseFloat(r.value);
          if(wv&&rv) d.nivel_fuerza[lift]=epley(wv,rv);
        }
      } else {
        const el=$('#f-'+lift); if(el) d.nivel_fuerza[lift]= el.value? Number(el.value): null;
      }
    });
    const dom=$('#f-dominadas'); if(dom) d.nivel_fuerza.dominadas = dom.value? Number(dom.value):0;
    const wb=$('#f-wallballs'); if(wb) d.nivel_fuerza.wallballs20 = wb.value;
  }
  if(step==='fisiologia'){

function sparkline(values, color){
  if(!values.length) return '';
  const w=120,h=30,pad=4;
  const min=Math.min(...values), max=Math.max(...values);
  const range = (max-min)||1;
  const pts = values.map((v,i)=>{
    const x = pad + (i/(Math.max(1,values.length-1)))*(w-pad*2);
    const y = h-pad - ((v-min)/range)*(h-pad*2);
    return [x,y];
  });
  const path = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const last = pts[pts.length-1];
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="tile-spark">
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="4" fill="${color}" stroke="var(--surface)" stroke-width="2"/>
  </svg>`;
}

function buildStatTiles(marcas){
  const groups = {};
  marcas.forEach(m=>{ const k = m.marker_key||m.marker_id; (groups[k]=groups[k]||[]).push(m); });
  const tiles = Object.keys(groups).map(k=>{
    const arr = groups[k].sort((a,b)=>a.created_at-b.created_at);
    const last = arr[arr.length-1];
    const prev = arr[arr.length-2];
    const numVal = last.value_num!=null? last.value_num : (last.weight_kg!=null? last.weight_kg : (last.pace_sec_per_km!=null? last.pace_sec_per_km : null));
    let delta=null, deltaClass='flat';
    if(prev){
      const pv = prev.value_num!=null? prev.value_num : (prev.weight_kg!=null? prev.weight_kg : (prev.pace_sec_per_km!=null? prev.pace_sec_per_km : null));
      if(pv!=null && numVal!=null){ delta = numVal-pv;
        const higherIsBetter = !(last.marker_id==='run'); // pace: lower better; weights/reps: higher better
        deltaClass = delta===0? 'flat' : ( (higherIsBetter? delta>0 : delta<0) ? 'good':'bad');
      }
    }
    const color = last.marker_id==='run'? 'var(--run)' : (k.startsWith('ex:')||last.marker_id==='exercise'? 'var(--strength)':'var(--leg)');
    const spark = sparkline(arr.slice(-8).map(a=> a.value_num!=null?a.value_num:(a.weight_kg!=null?a.weight_kg:(a.pace_sec_per_km!=null?a.pace_sec_per_km:0))), color.startsWith('var')?getComputedStyle(document.documentElement).getPropertyValue(color.slice(4,-1)):color);
    return {last, delta, deltaClass, spark, sortKey:last.created_at};
  });
  return tiles.sort((a,b)=>b.sortKey-a.sortKey);
}

function renderTile(t){
  const m = t.last;
  const isRun = m.marker_id==='run';
  let valDisplay;
  if(isRun) valDisplay = m.pace_sec_per_km? paceToStr(m.pace_sec_per_km)+'/km' : (m.value_raw||'—');

  else if(m.value_num!=null) valDisplay = m.value_num;
  else valDisplay = m.value_raw||'—';
  const deltaTxt = t.delta==null? '' : (t.delta>0?'+':'')+ (isRun? paceToStr(Math.abs(t.delta)) : Math.round(t.delta*10)/10);
  return `
  <div class="tile">
    <div class="tile-top">
      <span class="tile-label">${escapeHtml(m.marker_label||m.marker_id)}</span>
      ${t.delta!=null?`<span class="tile-delta ${t.deltaClass}">${deltaTxt}</span>`:''}
    </div>
    <div class="tile-value">${valDisplay}</div>
    ${t.spark}
    <div class="tile-date">${new Date(m.created_at).toLocaleDateString('es-ES',{day:'2-digit',month:'short'})}</div>
  </div>`;
}

}

async function saveLog(kind){
  const p = State.profile;
  const fecha = $('#lg-fecha').value || todayISO();
  const created_at = new Date(fecha+'T12:00:00').getTime();
  const nota = ($('#lg-nota')||{}).value || '';
  if(kind==='run'){
    const dist = parseFloat($('#lg-dist').value);
    const t = clockToSec($('#lg-tiempo').value);
    if(!dist || !t){ alert('Introduce distancia y tiempo válidos.'); return; }
    const pace = t/dist;
    await Store.addMarca(p.id, {marker_id:'run', marker_key:'run', marker_label:'Carrera', fecha, created_at,
      distance_km:dist, time_sec:t, pace_sec_per_km:pace, value_raw:dist+'km en '+secToClock(t), note:nota});
  }
  if(kind==='session'){
    const session_id = uid();
    for(const r of State.logExercises){
      const cat = CATALOG.find(c=>c.slug===r.slug);
      const label = cat? cat.label : (r.freeName||'Ejercicio');
      const key = 'ex:' + (r.slug || slugify(r.freeName));
      if(!r.sets && !r.reps && !r.weight) continue;
      await Store.addMarca(p.id, {marker_id:'exercise', marker_key:key, marker_label:label, fecha, created_at,
        sets:r.sets?Number(r.sets):null, reps:r.reps?Number(r.reps):null, weight_kg:r.weight?Number(r.weight):null,
        value_raw:`${r.sets||'?'}×${r.reps||'?'} @ ${r.weight||'?'}kg`, note:nota, session_id});
    }
  }
  if(kind==='specific'){
    const type = $('#lg-spec-type').value;
    const meta = SPECIFIC_MARKERS.find(m=>m.id===type);
    const label = type==='custom'? ($('#lg-spec-name').value||'Personalizado') : meta.label;
    const rawVal = $('#lg-spec-value').value;
    const numVal = parseFloat(rawVal);
    await Store.addMarca(p.id, {marker_id:type, marker_key:type==='custom'?('custom:'+slugify(label)):type, marker_label:label, fecha, created_at,
      value_raw:rawVal, value_num: isNaN(numVal)? null : numVal, note:nota});
  }
  State.marcas = await Store.listMarcas(p.id);
  State.logType = null; State.logExercises=[];
  render();
}

        <div class="summary-row"><span class="k">Ritmo libre (5K)</span><span class="v">${perfil.nivel_running.pace5k_sec?paceToStr(perfil.nivel_running.pace5k_sec)+'/km':'—'}</span></div>
        <div class="summary-row"><span class="k">Frecuencia actual</span><span class="v">${perfil.nivel_running.frecuencia} sesiones/sem</span></div>
      </div>
    </div>
    <div class="perfil-block card">
      <h3>Fuerza</h3>
      <div class="summary-list">
        <div class="summary-row"><span class="k">Sentadilla 1RM</span><span class="v">${perfil.nivel_fuerza.squat||'—'} kg</span></div>
        <div class="summary-row"><span class="k">Peso muerto 1RM</span><span class="v">${perfil.nivel_fuerza.deadlift||'—'} kg</span></div>
        <div class="summary-row"><span class="k">Press banca 1RM</span><span class="v">${perfil.nivel_fuerza.bench||'—'} kg</span></div>
        <div class="summary-row"><span class="k">Dominadas</span><span class="v">${perfil.nivel_fuerza.dominadas||0}</span></div>
      </div>
    </div>
    <div class="perfil-block card">
      <h3>Disponibilidad</h3>
      <div class="summary-list">
        <div class="summary-row"><span class="k">Días/semana</span><span class="v">${perfil.disponibilidad.dias}</span></div>
        <div class="summary-row"><span class="k">Minutos/sesión</span><span class="v">${perfil.disponibilidad.minutos}</span></div>
        <div class="summary-row"><span class="k">Equipamiento</span><span class="v">${({completo:'Completo',basico:'Básico',ninguno:'Sin equipo'})[perfil.disponibilidad.equipamiento]}</span></div>
      </div>
    </div>
    <div class="perfil-block card" style="grid-column:1/-1;">
      <h3>Lesiones y limitaciones</h3>
      ${perfil.lesiones.length? `<div class="tag-list">${perfil.lesiones.map(l=>`<span class="chip chip-leg">${ZONE_LABEL[l.zona]} · ${({activa:'activa',rehab:'rehab',antigua:'antigua'})[l.estado]}</span>`).join('')}</div>` : `<p class="field-note" style="margin:0;">Ninguna declarada.</p>`}
    </div>
  </div>
  <div style="margin-top:22px;display:flex;gap:10px;">
    <button class="btn btn-primary" data-action="edit-perfil">Editar y regenerar plan</button>
  </div>
  `;
}
function bindPerfilView(){
  const b = $('[data-action="edit-perfil"]'); if(b) b.addEventListener('click', ()=>{
    State.draft = JSON.parse(JSON.stringify(State.profile.perfil));
    State.newProfileName = State.profile.name;
    State.onboardingStep = 0;
    State.view = 'onboarding';
    render();
  });
}

/* --------------------------- BOOT --------------------------- */
async function enterAsUser(user){
  const prof = await Store.getProfile(user.id);
  if(prof && prof.plan){
    State.profile = prof;
    State.marcas = await Store.listMarcas(user.id);
    State.view = 'resumen';
  } else {
    State.draft = (prof && prof.perfil) ? prof.perfil : initDraft();
    State.profile = prof; // puede ser null si es la primera vez
    State.newProfileName = prof? prof.name : '';
    State.onboardingStep = 0;
    State.view = 'onboarding';
  }
  render();
}

(async function boot(){
  if(!CONFIGURED){ State.view='not-configured'; render(); return; }
  Auth.init();
  const user = await Auth.getUser();
  if(user){ await enterAsUser(user); }
  else { State.view = 'auth'; render(); }
  Auth.onChange(async (u)=>{
    if(u && State.view==='auth'){ await enterAsUser(u); }
    if(!u && State.view!=='auth'){ State.profile=null; State.marcas=[]; State.view='auth'; render(); }
  });
})();
</script>
</body>
</html>
